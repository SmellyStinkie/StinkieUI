# Publishes Stinkie UI when a version tag (like v0.20.0) is pushed:
# runs the tests, and only if they pass builds the zip and uploads it to CurseForge, Wago and
# GitHub Releases.
# A site whose secret isn't set is simply skipped.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # lets the workflow create the GitHub release

jobs:
  # the same checks as the Tests workflow; a tag whose tests fail is never published
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install lupa cbor2

      - name: Run the tests
        run: python dev/tests/run.py

  release:
    needs: tests
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the changelog can be built from commits

      - name: Package and upload
        uses: BigWigsMods/packager@v2
